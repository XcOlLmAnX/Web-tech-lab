<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="feedback.css">
    <title>Document</title>
</head>

<body>
    <form action="https://httpbin.org/post" method="POST" enctype="multipart/form-data">
        <div>
            <h1>Форма обратной связи</h1>

            <div>
                <label for="name">ФИО:</label>
                <input type="text" name="name" id="name" required>
            </div>  

            <div>
                <label for="email">Адрес электронной почты:</label>
                <input type="email" name="email" id="email" placeholder="Введите почту" required>
            </div>

            <div>
                <label for="from">Откуда вы узнали о нас?
                    <div>
                        <input type="radio" name="found" value="friends" required>
                        Рассказали друзья
                        <input type="radio" name="found" value="ads">
                        Реклама в интернете
                    </div>
            
                </label>
            </div>
        
            <div>
                <label for="category">Категория обращения</label>
                <select name="category" id="category">
                    <option value="" disabled selected>Выберите вариант</option>
                    <option value="complaint">Жалоба</option>
                    <option value="suggestion">Предложение</option>
                </select>
            </div>

            <label for="message">Текст сообщения:</label>

            <div>
                <textarea name="message" id="message" rows="8" cols="40"></textarea>
            </div>
        
            <div>
                <label for="file">Вложение</label>
                <input type="file" name="file" id="file">
            </div>

            <div>
                <label for="info">
                    <input type="checkbox" name="info" id="info" required>
                    Даю согласие на обработку персональных данных
                </label>
            </div>

            <button type="submit" class="submit-btn">Отправить</button>
        </div>
    </form>

    
</body>
</html>
